---
minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit]
fail_fast: false
repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trailing whitespace
        entry: python scripts/quality/text_checks.py trailing
        language: unsupported
        types: [text]
      - id: end-of-file
        name: final newline
        entry: python scripts/quality/text_checks.py eof
        language: unsupported
        types: [text]
      - id: yaml
        name: YAML syntax and style
        entry: yamllint --config-file .yamllint.yaml
        language: unsupported
        types: [yaml]
      - id: terraform-fmt
        name: Terraform format
        entry: terraform fmt -check
        language: unsupported
        types: [terraform]
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: unsupported
        types: [shell]
      - id: private-key
        name: private key detector
        entry: python scripts/quality/detect_private_key.py
        language: unsupported
        types: [text]
      - id: markdown
        name: Markdown structure
        entry: pymarkdown --config .pymarkdown.json scan
        language: unsupported
        types: [markdown]
      - id: gitleaks-working-tree
        name: Gitleaks working tree
        entry: bash scripts/quality/secret-scan.sh --working-tree-only
        language: unsupported
        pass_filenames: false
