---
- name: Create the node-local WireGuard secret boundary
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate the node-local WireGuard private key once
  ansible.builtin.shell: |
    set -o pipefail
    umask 077
    wg genkey > /etc/wireguard/{{ phase3_wireguard_interface }}.key
  args:
    executable: /bin/bash
    creates: "/etc/wireguard/{{ phase3_wireguard_interface }}.key"
  no_log: true

- name: Derive the public key locally without retrieving the private key
  ansible.builtin.shell: |
    set -o pipefail
    umask 077
    wg pubkey < /etc/wireguard/{{ phase3_wireguard_interface }}.key \
      > /etc/wireguard/{{ phase3_wireguard_interface }}.pub
  args:
    executable: /bin/bash
    creates: "/etc/wireguard/{{ phase3_wireguard_interface }}.pub"
  no_log: true

- name: Read only the non-secret node public key
  ansible.builtin.slurp:
    src: "/etc/wireguard/{{ phase3_wireguard_interface }}.pub"
  register: wireguard_public_key_file

- name: Publish the non-secret key within this Ansible run
  ansible.builtin.set_fact:
    wireguard_public_key: "{{ wireguard_public_key_file.content | b64decode | trim }}"

- name: Configure the complete encrypted management mesh
  when: not wireguard_identity_only | bool
  block:
    - name: Assert every peer identity is available before rendering
      ansible.builtin.assert:
        that:
          - hostvars[item].wireguard_public_key is defined
          - hostvars[item].ansible_host is defined
          - phase3_wireguard_addresses[item] is defined
        fail_msg: A WireGuard peer is missing its public key, endpoint, or overlay address.
      loop: "{{ groups['management_servers'] }}"

    - name: Render the public-peer WireGuard configuration
      ansible.builtin.template:
        src: wg-mgmt.conf.j2
        dest: "/etc/wireguard/{{ phase3_wireguard_interface }}.conf"
        owner: root
        group: root
        mode: "0600"
      register: wireguard_config
      notify: Restart WireGuard

    - name: Create the WireGuard service override directory
      ansible.builtin.file:
        path: "/etc/systemd/system/wg-quick@{{ phase3_wireguard_interface }}.service.d"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Keep the private key node-local at service start
      ansible.builtin.template:
        src: private-key-override.conf.j2
        dest: "/etc/systemd/system/wg-quick@{{ phase3_wireguard_interface }}.service.d/10-private-key.conf"
        owner: root
        group: root
        mode: "0644"
      register: wireguard_override
      notify: Restart WireGuard

    - name: Enable the WireGuard mesh service
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ phase3_wireguard_interface }}.service"
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply pending WireGuard configuration changes now
      ansible.builtin.meta: flush_handlers

    - name: Verify the local overlay address and MTU
      ansible.builtin.command:
        argv:
          - ip
          - --json
          - address
          - show
          - dev
          - "{{ phase3_wireguard_interface }}"
      register: wireguard_link
      changed_when: false

    - name: Assert the exact local WireGuard link contract
      ansible.builtin.assert:
        that:
          - (wireguard_link.stdout | from_json)[0].mtu | int == phase3_wireguard_mtu | int
          - >-
            phase3_wireguard_addresses[inventory_hostname] in
            ((wireguard_link.stdout | from_json)[0].addr_info | map(attribute='local') | list)
        fail_msg: The WireGuard interface has the wrong address or MTU.
