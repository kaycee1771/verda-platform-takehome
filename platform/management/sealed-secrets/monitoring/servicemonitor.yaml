---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sealed-secrets-controller
  namespace: sealed-secrets
  labels:
    app.kubernetes.io/name: sealed-secrets
    app.kubernetes.io/part-of: verda-platform
    platform.verda-demo.io/monitor: "true"
spec:
  namespaceSelector:
    matchNames:
      - sealed-secrets
  selector:
    matchLabels:
      app.kubernetes.io/name: sealed-secrets
      app.kubernetes.io/instance: sealed-secrets
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
