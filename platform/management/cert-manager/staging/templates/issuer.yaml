---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
spec:
  acme:
    email: {{ required "acmeEmail is required" .Values.acmeEmail | quote }}
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingressClassName | quote }}
            serviceType: ClusterIP
            podTemplate:
              metadata:
                labels:
                  verda.platform/component: acme-http01-solver
              spec:
                nodeSelector:
                  kubernetes.io/os: linux
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 100m
                    memory: 64Mi
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
