---
# The initial reconciliation creates only a staging Issuer and Certificate.
# Harbor remains disabled until the exact certificate, SealedSecrets, PostgreSQL,
# capacity envelope, and all eight runtime image digests are independently proven.
gates:
  stagingCertificateVerified: false
  sealedSecretsReady: false
  postgresqlReady: false
  capacityAdmitted: false
  imageDigestsLocked: false

certificate:
  acmeEmail: kelechi.okpala13@yahoo.com
  ingressClassName: traefik
  stagingSecretName: harbor-staging-tls
  productionSecretName: tls-harbor-ingress

harbor:
  enabled: false
  fullnameOverride: harbor
  externalURL: https://harbor.95-133-252-214.sslip.io
  imagePullPolicy: IfNotPresent
  priorityClassName: platform-important

  expose:
    type: ingress
    tls:
      enabled: true
      certSource: secret
      secret:
        secretName: tls-harbor-ingress
    ingress:
      hosts:
        core: harbor.95-133-252-214.sslip.io
      controller: default
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        verda.platform/authentication-boundary: harbor-local-rbac

  persistence:
    enabled: true
    resourcePolicy: keep
    persistentVolumeClaim:
      registry:
        storageClass: longhorn-critical
        accessMode: ReadWriteOnce
        size: 20Gi
      jobservice:
        jobLog:
          storageClass: longhorn-standard
          accessMode: ReadWriteOnce
          size: 2Gi
      redis:
        storageClass: longhorn-critical
        accessMode: ReadWriteOnce
        size: 2Gi
      trivy:
        storageClass: longhorn-standard
        accessMode: ReadWriteOnce
        size: 10Gi
    imageChartStorage:
      type: filesystem
      filesystem:
        rootdirectory: /storage

  updateStrategy:
    type: Recreate
  containerSecurityContext:
    privileged: false
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop: [ALL]

  existingSecretAdminPassword: harbor-admin
  existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
  harborAdminPassword: ""
  existingSecretSecretKey: harbor-core-secrets
  secretKey: ""
  enableMigrateHelmHook: false

  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

  portal:
    image:
      repository: docker.io/goharbor/harbor-portal
      tag: v2.15.2@sha256:b811b67f7a7f6f1614e4bdf7478b207d13e8aa3f815ff6ad84f216a5098d213d
    replicas: 1
    priorityClassName: platform-important
    podDisruptionBudget: {enabled: false}
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 200m, memory: 128Mi}
    topologySpreadConstraints: &spread
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway

  core:
    image:
      repository: docker.io/goharbor/harbor-core
      tag: v2.15.2@sha256:d7b780d23721a000f0fb8e181add6675eafa336de5d033b77fd7da0c171ff7f7
    replicas: 1
    priorityClassName: platform-important
    podDisruptionBudget: {enabled: false}
    existingSecret: harbor-core-secrets
    secretName: harbor-token-signing
    existingXsrfSecret: harbor-core-secrets
    existingXsrfSecretKey: CSRF_KEY
    secret: ""
    resources:
      requests: {cpu: 150m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
    topologySpreadConstraints: *spread

  jobservice:
    image:
      repository: docker.io/goharbor/harbor-jobservice
      tag: v2.15.2@sha256:f71a4452a095bcd2a8f0683648a3ae28415432df87ccfb00ec7625f3e340a598
    replicas: 1
    priorityClassName: platform-important
    podDisruptionBudget: {enabled: false}
    existingSecret: harbor-jobservice
    existingSecretKey: JOBSERVICE_SECRET
    secret: ""
    jobLoggers: [file]
    resources:
      requests: {cpu: 75m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    topologySpreadConstraints: *spread

  registry:
    registry:
      image:
        repository: docker.io/goharbor/registry-photon
        tag: v2.15.2@sha256:c4ebef61ceb50a3d8bc21d149bc280422db20a1e69df317b64b74098c3615855
      resources:
        requests: {cpu: 75m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
    controller:
      image:
        repository: docker.io/goharbor/harbor-registryctl
        tag: v2.15.2@sha256:223d5cb49d5dbf0ba4ae022e7dd9775fa459904112dc12084d3aaa36c1408362
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: 250m, memory: 256Mi}
    replicas: 1
    priorityClassName: platform-important
    podDisruptionBudget: {enabled: false}
    existingSecret: harbor-registry
    existingSecretKey: REGISTRY_HTTP_SECRET
    secret: ""
    credentials:
      username: harbor_registry_user
      password: ""
      existingSecret: harbor-registry-credentials
    topologySpreadConstraints: *spread

  trivy:
    enabled: true
    image:
      repository: docker.io/goharbor/trivy-adapter-photon
      tag: v2.15.2@sha256:215c07b71c37fc7fc16e02d9185d936dcb8884a80e810817c2cd058bbd7c4e98
    replicas: 1
    priorityClassName: platform-important
    podDisruptionBudget: {enabled: false}
    insecure: false
    skipUpdate: false
    skipJavaDBUpdate: false
    offlineScan: false
    securityCheck: vuln
    vulnType: os,library
    severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
    dbRepository:
      - mirror.gcr.io/aquasec/trivy-db
      - ghcr.io/aquasecurity/trivy-db
    javaDBRepository:
      - mirror.gcr.io/aquasec/trivy-java-db
      - ghcr.io/aquasecurity/trivy-java-db
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    topologySpreadConstraints: *spread

  database:
    type: external
    external:
      host: harbor-postgresql.harbor.svc.cluster.local
      port: "5432"
      username: harbor
      password: ""
      coreDatabase: registry
      existingSecret: harbor-database-credentials
      sslmode: disable
    maxIdleConns: 20
    maxOpenConns: 80

  redis:
    type: internal
    internal:
      image:
        repository: docker.io/goharbor/valkey-photon
        tag: v2.15.2@sha256:7337783e8148f01a25b113f5c7b1d640f78b1860fcaf80a33d0dbb294f7b99d0
      priorityClassName: platform-important
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: 250m, memory: 256Mi}

  exporter:
    image:
      repository: docker.io/goharbor/harbor-exporter
      tag: v2.15.2@sha256:e1b0a248f61aad5084c5d1612d5f1da89f99c23ce743eaf8cba913d6d00c0547
    replicas: 1
    priorityClassName: platform-important
    podDisruptionBudget: {enabled: false}
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 200m, memory: 128Mi}
    topologySpreadConstraints: *spread

  nginx:
    podDisruptionBudget: {enabled: false}
  internalTLS:
    enabled: false
