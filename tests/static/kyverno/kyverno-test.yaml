---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: phase6-audit-baseline
policies:
  - ../../../policies/kyverno/base/workload-baseline.yaml
  - ../../../policies/kyverno/base/require-strict-sealing-scope.yaml
resources:
  - valid-pod.yaml
  - invalid-pod.yaml
  - strict-sealing-fixture.yaml
  - cluster-wide-sealing-fixture.yaml
  - namespace-wide-sealing-fixture.yaml
results:
  - policy: workload-baseline
    rule: require-workload-identity-labels
    resources:
      - valid-pod
    kind: Pod
    result: pass
  - policy: workload-baseline
    rule: require-container-requests
    resources:
      - valid-pod
    kind: Pod
    result: pass
  - policy: workload-baseline
    rule: audit-immutable-images
    resources:
      - valid-pod
    kind: Pod
    result: pass
  - policy: workload-baseline
    rule: require-workload-identity-labels
    resources:
      - invalid-pod
    kind: Pod
    result: fail
  - policy: workload-baseline
    rule: require-container-requests
    resources:
      - invalid-pod
    kind: Pod
    result: fail
  - policy: workload-baseline
    rule: audit-immutable-images
    resources:
      - invalid-pod
    kind: Pod
    result: fail
  - policy: sealed-secret-strict-scope
    rule: reject-cluster-wide-scope
    resources:
      - strict-fixture
    kind: SealedSecret
    result: pass
  - policy: sealed-secret-strict-scope
    rule: reject-namespace-wide-scope
    resources:
      - strict-fixture
    kind: SealedSecret
    result: pass
  - policy: sealed-secret-strict-scope
    rule: reject-cluster-wide-scope
    resources:
      - cluster-wide-fixture
    kind: SealedSecret
    result: fail
  - policy: sealed-secret-strict-scope
    rule: reject-namespace-wide-scope
    resources:
      - namespace-wide-fixture
    kind: SealedSecret
    result: fail
