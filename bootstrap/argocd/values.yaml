---
# Day-zero only. Day-one platform services and exposure are reconciled from Git.
global:
  image:
    repository: quay.io/argoproj/argocd
    tag: v3.5.1@sha256:0deb1a1c917629b960ead995ae3b6069450a866992676599658687ef9a641ee8
  logging:
    format: json
    level: info
  networkPolicy:
    create: false
    defaultDenyIngress: false

crds:
  install: true
  keep: true

configs:
  cm:
    admin.enabled: true
    users.anonymous.enabled: false
    exec.enabled: false
    statusbadge.enabled: false
    accounts.platform-admin: login
    accounts.reviewer: login
    resource.exclusions: |
      - apiGroups:
          - ext.cattle.io
        kinds:
          - Token
        clusters:
          - "*"
    resource.customizations.health.argoproj.io_Application: |
      health = {}
      health.status = "Progressing"
      health.message = "Waiting for child Application health"
      if obj.status ~= nil and obj.status.health ~= nil then
        health.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          health.message = obj.status.health.message
        end
      end
      return health
  params:
    # TLS terminates at RKE2-owned Traefik; access to this cleartext backend is
    # constrained by the exact NetworkPolicy below.
    server.insecure: true
  rbac:
    policy.default: role:authenticated
    policy.matchMode: glob
    scopes: "[groups]"
    policy.csv: |
      g, platform-admin, role:admin
      g, reviewer, role:reviewer
      p, role:reviewer, applications, get, platform-bootstrap/*, allow
      p, role:reviewer, applications, sync, platform-bootstrap/*, deny
      p, role:reviewer, applications, action/*, platform-bootstrap/*, deny
      p, role:reviewer, logs, get, platform-bootstrap/*, allow
      p, role:reviewer, applications, get, platform/*, allow
      p, role:reviewer, applications, sync, platform/*, deny
      p, role:reviewer, applications, action/*, platform/*, deny
      p, role:reviewer, logs, get, platform/*, allow
      p, role:reviewer, applications, get, foundation/*, allow
      p, role:reviewer, applications, sync, foundation/*, deny
      p, role:reviewer, applications, action/*, foundation/*, deny
      p, role:reviewer, logs, get, foundation/*, allow
      p, role:reviewer, applications, get, security/*, allow
      p, role:reviewer, applications, sync, security/*, deny
      p, role:reviewer, applications, action/*, security/*, deny
      p, role:reviewer, logs, get, security/*, allow
      p, role:reviewer, applications, get, management/*, allow
      p, role:reviewer, applications, sync, management/*, deny
      p, role:reviewer, applications, action/*, management/*, deny
      p, role:reviewer, logs, get, management/*, allow
      p, role:reviewer, applications, get, registry/*, allow
      p, role:reviewer, applications, sync, registry/*, deny
      p, role:reviewer, applications, action/*, registry/*, deny
      p, role:reviewer, logs, get, registry/*, allow
      p, role:reviewer, applications, get, observability/*, allow
      p, role:reviewer, applications, sync, observability/*, deny
      p, role:reviewer, applications, action/*, observability/*, deny
      p, role:reviewer, logs, get, observability/*, allow
      p, role:reviewer, applications, get, backup/*, allow
      p, role:reviewer, applications, sync, backup/*, deny
      p, role:reviewer, applications, action/*, backup/*, deny
      p, role:reviewer, logs, get, backup/*, allow
      p, role:reviewer, applications, get, monitoring-targets/*, allow
      p, role:reviewer, applications, sync, monitoring-targets/*, deny
      p, role:reviewer, applications, action/*, monitoring-targets/*, deny
      p, role:reviewer, logs, get, monitoring-targets/*, allow
      p, role:reviewer, applications, get, dev/*, allow
      p, role:reviewer, applications, sync, dev/*, deny
      p, role:reviewer, applications, action/*, dev/*, deny
      p, role:reviewer, logs, get, dev/*, allow
      p, role:reviewer, applications, get, staging/*, allow
      p, role:reviewer, applications, sync, staging/*, deny
      p, role:reviewer, applications, action/*, staging/*, deny
      p, role:reviewer, logs, get, staging/*, allow
      p, role:reviewer, applications, get, prod/*, allow
      p, role:reviewer, applications, sync, prod/*, deny
      p, role:reviewer, applications, action/*, prod/*, deny
      p, role:reviewer, logs, get, prod/*, allow

dex:
  enabled: false

controller:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 2Gi}
  metrics:
    enabled: true
    serviceMonitor: {enabled: false}

server:
  replicas: 2
  pdb: {enabled: true, minAvailable: 1}
  ingress: {enabled: false}
  ingressGrpc: {enabled: false}
  route: {enabled: false}
  httproute: {enabled: false}
  grpcroute: {enabled: false}
  service: {type: ClusterIP}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  metrics:
    enabled: true
    serviceMonitor: {enabled: false}

repoServer:
  replicas: 2
  pdb: {enabled: true, minAvailable: 1}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  metrics:
    enabled: true
    serviceMonitor: {enabled: false}

applicationSet:
  replicas: 2
  pdb: {enabled: true, minAvailable: 1}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  metrics:
    enabled: true
    serviceMonitor: {enabled: false}

notifications:
  enabled: false

redis:
  image:
    repository: docker.io/library/redis
    tag: 8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}

redisSecretInit:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}

# Helm owns this restricted authorization anchor to remove the root-AppProject
# bootstrap cycle. It can render only Argo child objects in namespace argocd.
extraObjects:
  - apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: platform-bootstrap
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: Helm
        platform.verda-demo.io/ownership: day-zero
    spec:
      description: Restricted fixed point for the single platform root Application
      sourceRepos:
        - https://github.com/kaycee1771/verda-platform-takehome.git
      destinations:
        - namespace: argocd
          server: https://kubernetes.default.svc
      clusterResourceWhitelist: []
      namespaceResourceWhitelist:
        - {group: argoproj.io, kind: Application}
        - {group: argoproj.io, kind: ApplicationSet}
        - {group: argoproj.io, kind: AppProject}
      orphanedResources:
        warn: true
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-server-bootstrap-ingress
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: Helm
        platform.verda-demo.io/ownership: day-zero
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-server
      policyTypes:
        - Ingress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: rke2-traefik
          ports:
            - protocol: TCP
              port: 8080
