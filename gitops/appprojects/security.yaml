---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security
  namespace: argocd
spec:
  description: Phase 6 Sealed Secrets and Audit-first Kyverno trust domain
  sourceRepos:
    - https://github.com/kaycee1771/verda-platform-takehome.git
    - https://bitnami.github.io/sealed-secrets
    - https://kyverno.github.io/kyverno
  destinations:
    - {namespace: sealed-secrets, server: https://kubernetes.default.svc}
    - {namespace: kyverno, server: https://kubernetes.default.svc}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: kyverno.io, kind: ClusterPolicy}
  namespaceResourceWhitelist:
    - {group: "*", kind: "*"}
  orphanedResources: {warn: true}
