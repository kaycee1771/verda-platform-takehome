---
- name: Apply host sysctls before Kubernetes
  ansible.builtin.command:
    argv:
      - sysctl
      - --system
  changed_when: true

- name: Apply controlled security updates
  ansible.builtin.command:
    argv:
      - unattended-upgrade
      - --verbose
  changed_when: true

- name: Reload NetworkManager before RKE2
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    state: reloaded
