{{- if .Values.activation.enabled }}
{{- $admission := include "platformDemo.assertActivation" . -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-demo
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "platformDemo.labels" . | nindent 4 }}
  annotations:
    verda.platform/activation: {{ $admission | quote }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-demo
      app.kubernetes.io/instance: platform-demo
  template:
    metadata:
      labels:
        {{- include "platformDemo.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: {{ .Values.serviceAccountName | quote }}
      automountServiceAccountToken: false
      priorityClassName: {{ .Values.priorityClassName | quote }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName | quote }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: platform-demo
              app.kubernetes.io/instance: platform-demo
      containers:
        - name: app
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          env:
            - {name: APP_ENVIRONMENT, value: {{ .Values.environment | quote }}}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-demo
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "platformDemo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-demo
    app.kubernetes.io/instance: platform-demo
  ports:
    - {name: http, protocol: TCP, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-demo
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "platformDemo.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    verda.platform/authentication-boundary: public-demo-no-administrative-surface
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Values.hostname | quote }}]
      secretName: {{ .Values.certificate.productionSecretName | quote }}
  rules:
    - host: {{ .Values.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-demo
                port: {name: http}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform-demo
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "platformDemo.labels" . | nindent 4 }}
    platform.verda-demo.io/monitor: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-demo
      app.kubernetes.io/instance: platform-demo
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 5s
      scheme: http
{{- end }}
