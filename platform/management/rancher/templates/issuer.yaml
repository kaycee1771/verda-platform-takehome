---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-staging
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  acme:
    email: {{ required "certificate.acmeEmail is required" .Values.certificate.acmeEmail | quote }}
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.certificate.ingressClassName | quote }}
            serviceType: ClusterIP
            podTemplate:
              metadata:
                labels:
                  verda.platform/component: rancher-acme-http01-solver
              spec:
                nodeSelector:
                  kubernetes.io/os: linux
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 100m
                    memory: 64Mi
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
{{- if .Values.gates.stagingCertificateVerified }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-production
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    verda.platform/staging-proof: verified
spec:
  acme:
    email: {{ .Values.certificate.acmeEmail | quote }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.certificate.ingressClassName | quote }}
            serviceType: ClusterIP
            podTemplate:
              metadata:
                labels:
                  verda.platform/component: rancher-acme-http01-solver
              spec:
                nodeSelector:
                  kubernetes.io/os: linux
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 100m
                    memory: 64Mi
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
{{- end }}
