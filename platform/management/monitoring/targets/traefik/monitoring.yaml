---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rke2-traefik
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: verda-platform
    platform.verda-demo.io/monitor: "true"
    platform.verda-demo.io/owner: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: metrics
      app.kubernetes.io/instance: rke2-traefik-kube-system
      app.kubernetes.io/name: rke2-traefik
  namespaceSelector:
    matchNames: [kube-system]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rke2-traefik-prometheus-ingress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: rke2-traefik-kube-system
      app.kubernetes.io/name: rke2-traefik
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: web}
        - {protocol: TCP, port: websecure}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports:
        - {protocol: TCP, port: metrics}
