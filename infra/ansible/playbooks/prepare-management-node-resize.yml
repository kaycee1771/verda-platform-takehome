---
- name: Validate the exact serial prepare target and survivor
  hosts: localhost
  gather_facts: false
  vars:
    phase6_survivor_contract:
      verda-mgmt-server-01: [verda-mgmt-server-02, verda-mgmt-server-03]
      verda-mgmt-server-02: [verda-mgmt-server-01, verda-mgmt-server-03]
      verda-mgmt-server-03: [verda-mgmt-server-01, verda-mgmt-server-02]
  tasks:
    - &phase6_prepare_authorization_gate
      name: Verify the controller-issued used-once operation authorization
      ansible.builtin.command:
        argv:
          - python
          - /workspace/scripts/phase6/assert-operation-authorization.py
          - --authorization
          - /run/secrets/phase6-operation-authorization.json
          - --contract
          - /run/config/phase6-active-contract.json
          - --journal
          - /run/config/phase6-operation-journal.json
          - --authorization-sha256
          - "{{ phase6_authorization_sha256 }}"
          - --operation-id
          - "{{ phase6_operation_id }}"
          - --commit
          - "{{ phase6_integrated_commit }}"
          - --node
          - "{{ phase6_resize_target[-2:] }}"
          - --direction
          - "{{ phase6_direction }}"
          - --mode
          - prepare
      changed_when: false
      delegate_to: localhost
      become: false
      register: phase6_step_authorized

    - name: Refuse an unexpected target or survivor
      ansible.builtin.assert:
        that:
          - phase6_resize_target in phase6_survivor_contract
          - phase6_prepare_survivor in phase6_survivor_contract[phase6_resize_target]
          - groups['management_servers'] | sort == ['verda-mgmt-server-01', 'verda-mgmt-server-02', 'verda-mgmt-server-03']
        fail_msg: The prepare target, survivor, or inventory topology differs from contract.

- name: Evacuate workloads and Longhorn replicas through a survivor
  hosts: "{{ phase6_prepare_survivor }}"
  remote_user: "{{ phase3_platform_admin }}"
  become: true
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - *phase6_prepare_authorization_gate
  tasks:
    - name: Install the controller-issued operation authorization
      ansible.builtin.copy:
        src: /run/secrets/phase6-operation-authorization.json
        dest: /run/verda-phase6-operation-authorization.json
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: phase6_step_authorized.rc == 0

    - name: Install the hash-bound active contract and operation journal
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - src: /run/config/phase6-active-contract.json
          dest: /run/verda-phase6-active-contract.json
        - src: /run/config/phase6-operation-journal.json
          dest: /run/verda-phase6-operation-journal.json
      no_log: true
      when: phase6_step_authorized.rc == 0

    - name: Install the bounded prepare helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../scripts/phase6/prepare-management-node-resize.sh"
        dest: /usr/local/libexec/verda-phase6-prepare-resize
        owner: root
        group: root
        mode: "0700"
      when: phase6_step_authorized.rc == 0

    - name: Cordon drain evacuate and prove the two-survivor boundary
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/verda-phase6-prepare-resize
          - "{{ phase6_resize_target }}"
          - --prepare
          - /run/verda-phase6-operation-authorization.json
          - "{{ phase6_operation_id }}"
          - /run/verda-phase6-active-contract.json
          - /run/verda-phase6-operation-journal.json
          - "{{ phase6_integrated_commit }}"
          - "{{ phase6_direction }}"
      register: phase6_prepare_result
      changed_when: true
      no_log: true
      when: phase6_step_authorized.rc == 0

- name: Stop RKE2 and cleanly unmount the evacuated replacement target
  hosts: "{{ phase6_resize_target }}"
  remote_user: "{{ phase3_platform_admin }}"
  become: true
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - *phase6_prepare_authorization_gate
  tasks:
    - name: Stop the selected RKE2 server
      ansible.builtin.systemd:
        name: rke2-server
        state: stopped
      when: phase6_step_authorized.rc == 0

    - name: Flush pending writes
      ansible.builtin.command: sync
      changed_when: false
      when: phase6_step_authorized.rc == 0

    - name: Unmount the evacuated Longhorn data filesystem
      ansible.posix.mount:
        path: /var/lib/longhorn
        state: unmounted
      when: phase6_step_authorized.rc == 0

    - name: Prove RKE2 is inactive and Longhorn storage is detached from the filesystem
      ansible.builtin.shell: |
        set -eu
        test "$(systemctl is-active rke2-server || true)" = inactive
        ! mountpoint -q /var/lib/longhorn
      args:
        executable: /bin/bash
      changed_when: false
      when: phase6_step_authorized.rc == 0

- name: Re-prove two-survivor readiness and etcd quorum after quiesce
  hosts: "{{ phase6_prepare_survivor }}"
  remote_user: "{{ phase3_platform_admin }}"
  become: true
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - *phase6_prepare_authorization_gate
  tasks:
    - name: Run the bounded post-quiesce survivor gate
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/verda-phase6-prepare-resize
          - "{{ phase6_resize_target }}"
          - --post-quiesce
          - /run/verda-phase6-operation-authorization.json
          - "{{ phase6_operation_id }}"
          - /run/verda-phase6-active-contract.json
          - /run/verda-phase6-operation-journal.json
          - "{{ phase6_integrated_commit }}"
          - "{{ phase6_direction }}"
      changed_when: false
      no_log: true
      when: phase6_step_authorized.rc == 0
