---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-critical
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    storageclass.kubernetes.io/is-default-class: "true"
    verda.io/data-classification: critical
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "60"
  fromBackup: ""
  fsType: ext4
  dataLocality: disabled
  replicaAutoBalance: least-effort
  diskSelector: dedicated
  nodeSelector: management-storage
  unmapMarkSnapChainRemoved: ignored
  disableRevisionCounter: "false"
  replicaSoftAntiAffinity: disabled
  replicaZoneSoftAntiAffinity: enabled
  replicaDiskSoftAntiAffinity: disabled
  dataEngine: v1
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-standard
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    storageclass.kubernetes.io/is-default-class: "false"
    verda.io/data-classification: regenerable-standard
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  # This non-default class trades one replica for capacity and is restricted to
  # explicitly classified, reproducible data. Platform state uses critical.
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: disabled
  replicaAutoBalance: least-effort
  diskSelector: dedicated
  nodeSelector: management-storage
  unmapMarkSnapChainRemoved: ignored
  disableRevisionCounter: "true"
  replicaSoftAntiAffinity: disabled
  replicaZoneSoftAntiAffinity: enabled
  replicaDiskSoftAntiAffinity: disabled
  dataEngine: v1
