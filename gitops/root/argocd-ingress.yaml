---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-public-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
  labels:
    app.kubernetes.io/part-of: verda-platform
    platform.verda-demo.io/phase: "5"
spec:
  project: platform
  source:
    repoURL: https://github.com/kaycee1771/verda-platform-takehome.git
    targetRevision: main
    path: platform/management/ingress/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 3m}
