---
# Values are consumed by the pinned Longhorn 1.12.1 Helm source. The release
# namespace is intentionally explicit so a chart default cannot move data-plane
# components into another namespace.
namespaceOverride: longhorn-system

image:
  longhorn:
    engine:
      tag: v1.12.1@sha256:9b1b720b56df6612c9589cbc156acbca6419fa61de818d05db7226b0722f2868
    manager:
      tag: v1.12.1@sha256:83b79f57043fe1405e68bc0d4c7987accbc6bb512def3e0db12b31966c070801
    ui:
      tag: v1.12.1@sha256:03a3ce6673df6e948c261fe978a695adaa8fb190d68bfe5c358af8ee3d3fbef5
    instanceManager:
      tag: v1.12.1@sha256:b255f3279dd9d830ea153e9369928646dee519fd853036388926dddb5c66094b
    shareManager:
      tag: v1.12.1@sha256:efaf47aeb4e8615e312f0880df860bf2e5b9fa53006fe075f057c6dd4089f47d
    backingImageManager:
      tag: v1.12.1@sha256:dfb9452e4190fb80e39c7976a0036ac0ca314c05328b67952f8c165cbb4dabf3
    supportBundleKit:
      tag: v0.0.92@sha256:02baa824d9a4174747ab9db2635ae000b1198d2d5ed3a4c69caf28724224e783
  csi:
    attacher:
      tag: v4.12.0@sha256:a814aa4784197116983ea13e376fc691e000a390de9d0b9fca2bc4a2fb7c4a1f
    provisioner:
      tag: v5.3.0@sha256:1bbb7b11d8087130e722e3249f364d0ab49ee3545e847c2f299e87b7e1ce5c4f
    nodeDriverRegistrar:
      tag: v2.17.0@sha256:29f7cfd519008fe8f8dff5e79db43f70d65c43a89c08f1bafbb199ca90df79f0
    resizer:
      tag: v2.2.1@sha256:63d0aef25114d4a682b25afa6d9623a3cfcc19aca910269124408476bbe2c6fd
    snapshotter:
      tag: v8.6.0@sha256:2bca9ac55170efa61dc50e5cc8d9550373db2e3e5161d82d3fdaac5c25150360
    livenessProbe:
      tag: v2.19.0@sha256:d0cb76b565ba9d36da0dc2b38e2b6a49a0ae4fe067b03086110682f32c600318

global:
  nodeSelector:
    kubernetes.io/os: linux

networkPolicies:
  enabled: true
  restrictInternalTraffic: true
  type: rke2
  kubeAPIServerSourceCIDRs: []

service:
  ui:
    type: ClusterIP
  manager:
    type: ClusterIP

# The chart-owned class is disabled. The reviewed classes under resources/ are
# the only dynamic-provisioning contract and avoid mutating Longhorn's built-in
# class across upgrades.
persistence:
  createStorageClass: false
  defaultClass: false

# Longhorn explicitly recommends disabling this Helm hook under Argo CD.
preUpgradeChecker:
  jobEnabled: false
  upgradeVersionCheck: true

csi:
  kubeletRootDir: /var/lib/kubelet
  attacherReplicaCount: 3
  provisionerReplicaCount: 3
  resizerReplicaCount: 3
  snapshotterReplicaCount: 3

defaultSettings:
  # Never auto-enrol a new node or its root filesystem. Git owns the three
  # Longhorn Node resources and their one permitted dedicated mount.
  createDefaultDiskLabeledNodes: true
  defaultDataPath: /var/lib/longhorn
  defaultDataLocality: disabled
  defaultReplicaCount: '{"v1":"3","v2":"3"}'

  replicaSoftAntiAffinity: false
  replicaZoneSoftAntiAffinity: true
  replicaDiskSoftAntiAffinity: false
  replicaAutoBalance: least-effort

  storageOverProvisioningPercentage: 100
  storageMinimalAvailablePercentage: 25
  storageReservedPercentageForDefaultDisk: 10
  allowEmptyNodeSelectorVolume: false
  allowEmptyDiskSelectorVolume: false
  allowVolumeCreationWithDegradedAvailability: false

  disableSchedulingOnCordonedNode: true
  nodeDownPodDeletionPolicy: do-nothing
  nodeDrainPolicy: block-if-contains-last-replica
  replicaReplenishmentWaitInterval: 600
  concurrentReplicaRebuildPerNodeLimit: 1
  rebuildConcurrentSyncLimit: 1
  autoSalvage: false

  v1DataEngine: true
  v2DataEngine: false
  systemManagedPodsImagePullPolicy: if-not-present
  systemManagedComponentsNodeSelector: kubernetes.io/os:linux
  csiStorageCapacityTracking: true
  nodeDiskHealthMonitoring: true

  upgradeChecker: false
  allowCollectingLonghornUsageMetrics: false
  logLevel: Info

longhornManager:
  log:
    format: json
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  serviceLabels:
    verda.io/metrics: longhorn
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1

longhornUI:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

ingress:
  enabled: false

httproute:
  enabled: false

# Prometheus Operator is a later-phase dependency. Longhorn Manager already
# exposes its metrics service; Phase 6 may enable this object after installing
# the ServiceMonitor CRD and its matching NetworkPolicy allowance.
metrics:
  serviceMonitor:
    enabled: false
