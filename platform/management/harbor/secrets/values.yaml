---
enabled: false
gates:
  ciphertextsLocked: false

# Replace these sentinels only with namespace/name-scoped ciphertext produced by
# kubeseal for the exact SealedSecret and key. Ciphertext is safe for Git;
# plaintext and the controller recovery key are not.
ciphertexts:
  adminPassword: REQUIRED_SEALED_CIPHERTEXT_HARBOR_ADMIN_PASSWORD
  coreSecretKey: REQUIRED_SEALED_CIPHERTEXT_HARBOR_CORE_SECRET_KEY
  coreSecret: REQUIRED_SEALED_CIPHERTEXT_HARBOR_CORE_SECRET
  coreXsrfKey: REQUIRED_SEALED_CIPHERTEXT_HARBOR_CORE_XSRF_KEY
  tokenPrivateKey: REQUIRED_SEALED_CIPHERTEXT_HARBOR_TOKEN_PRIVATE_KEY
  tokenCertificate: REQUIRED_SEALED_CIPHERTEXT_HARBOR_TOKEN_CERTIFICATE
  jobserviceSecret: REQUIRED_SEALED_CIPHERTEXT_HARBOR_JOBSERVICE_SECRET
  registryHttpSecret: REQUIRED_SEALED_CIPHERTEXT_HARBOR_REGISTRY_HTTP_SECRET
  registryPassword: REQUIRED_SEALED_CIPHERTEXT_HARBOR_REGISTRY_PASSWORD
  registryHtpasswd: REQUIRED_SEALED_CIPHERTEXT_HARBOR_REGISTRY_HTPASSWD
  databasePassword: REQUIRED_SEALED_CIPHERTEXT_HARBOR_DATABASE_PASSWORD
  databasePostgresPassword: REQUIRED_SEALED_CIPHERTEXT_HARBOR_DATABASE_POSTGRES_PASSWORD
