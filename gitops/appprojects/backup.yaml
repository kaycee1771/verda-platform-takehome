---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: backup
  namespace: argocd
spec:
  description: Phase 6 Velero controller and baseline recovery-point trust domain
  sourceRepos:
    - https://github.com/kaycee1771/verda-platform-takehome.git
    - https://vmware-tanzu.github.io/helm-charts
  destinations:
    - {namespace: velero, server: https://kubernetes.default.svc}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
  namespaceResourceWhitelist:
    - {group: "*", kind: "*"}
  orphanedResources: {warn: true}
