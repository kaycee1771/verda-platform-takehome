---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rancher
  namespace: cattle-system
  labels:
    app.kubernetes.io/part-of: verda-platform
    platform.verda-demo.io/monitor: "true"
    platform.verda-demo.io/owner: observability
spec:
  selector:
    matchLabels: {app: rancher}
  namespaceSelector:
    matchNames: [cattle-system]
  endpoints:
    - port: https-internal
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: tls-rancher-internal-ca
            key: tls.crt
        serverName: "10.43.24.242"
      relabelings:
        - targetLabel: __address__
          replacement: rancher-internal.cattle-system.svc:443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rancher-prometheus-ingress
  namespace: cattle-system
spec:
  podSelector:
    matchLabels: {app: rancher}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports:
        - {protocol: TCP, port: 444}
