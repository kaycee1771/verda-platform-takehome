---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kyverno-controllers
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/part-of: verda-platform
    platform.verda-demo.io/monitor: "true"
spec:
  namespaceSelector:
    matchNames:
      - kyverno
  selector:
    matchLabels:
      app.kubernetes.io/name: kyverno
      app.kubernetes.io/instance: kyverno
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - admission-controller
          - background-controller
          - reports-controller
  endpoints:
    - port: metrics-port
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: false
