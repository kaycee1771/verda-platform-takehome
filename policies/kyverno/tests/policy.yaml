---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-nonroot-fixture
  annotations:
    policies.kyverno.io/title: Require non-root test fixture
    policies.kyverno.io/category: Phase 1 Quality
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-run-as-nonroot
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: Pods must explicitly run as non-root.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
