{{- if .Values.enabled }}
{{- $admission := include "verdaHarborSecrets.assertAdmission" . -}}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-admin
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    verda.platform/ciphertext-admission: {{ $admission | quote }}
spec:
  encryptedData:
    HARBOR_ADMIN_PASSWORD: {{ .Values.ciphertexts.adminPassword | quote }}
  template:
    metadata: {name: harbor-admin, namespace: {{ .Release.Namespace | quote }}}
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-core-secrets
  namespace: {{ .Release.Namespace | quote }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  encryptedData:
    secretKey: {{ .Values.ciphertexts.coreSecretKey | quote }}
    secret: {{ .Values.ciphertexts.coreSecret | quote }}
    CSRF_KEY: {{ .Values.ciphertexts.coreXsrfKey | quote }}
  template:
    metadata: {name: harbor-core-secrets, namespace: {{ .Release.Namespace | quote }}}
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-token-signing
  namespace: {{ .Release.Namespace | quote }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  encryptedData:
    tls.key: {{ .Values.ciphertexts.tokenPrivateKey | quote }}
    tls.crt: {{ .Values.ciphertexts.tokenCertificate | quote }}
  template:
    metadata: {name: harbor-token-signing, namespace: {{ .Release.Namespace | quote }}}
    type: kubernetes.io/tls
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-jobservice
  namespace: {{ .Release.Namespace | quote }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  encryptedData:
    JOBSERVICE_SECRET: {{ .Values.ciphertexts.jobserviceSecret | quote }}
  template:
    metadata: {name: harbor-jobservice, namespace: {{ .Release.Namespace | quote }}}
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-registry
  namespace: {{ .Release.Namespace | quote }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  encryptedData:
    REGISTRY_HTTP_SECRET: {{ .Values.ciphertexts.registryHttpSecret | quote }}
  template:
    metadata: {name: harbor-registry, namespace: {{ .Release.Namespace | quote }}}
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-registry-credentials
  namespace: {{ .Release.Namespace | quote }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  encryptedData:
    REGISTRY_PASSWD: {{ .Values.ciphertexts.registryPassword | quote }}
    REGISTRY_HTPASSWD: {{ .Values.ciphertexts.registryHtpasswd | quote }}
  template:
    metadata: {name: harbor-registry-credentials, namespace: {{ .Release.Namespace | quote }}}
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-database-credentials
  namespace: {{ .Release.Namespace | quote }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  encryptedData:
    password: {{ .Values.ciphertexts.databasePassword | quote }}
    POSTGRES_PASSWORD: {{ .Values.ciphertexts.databasePostgresPassword | quote }}
  template:
    metadata: {name: harbor-database-credentials, namespace: {{ .Release.Namespace | quote }}}
    type: Opaque
{{- end }}
