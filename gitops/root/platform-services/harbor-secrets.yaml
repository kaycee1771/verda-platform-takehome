---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor-secrets
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-9"}
spec:
  project: registry
  source:
    repoURL: https://github.com/kaycee1771/verda-platform-takehome.git
    targetRevision: main
    path: platform/management/harbor/secrets
    helm: {releaseName: harbor-secrets}
  destination: {server: https://kubernetes.default.svc, namespace: harbor}
  syncPolicy:
    automated: {prune: false, selfHeal: true, allowEmpty: false}
    syncOptions: [PruneLast=true]
